spring:
  application:
    name: backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-client-id
            client-secret: dummy-client-secret
  datasource:
    url: jdbc:h2:file:./heimdall-test-data/config-db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

heimdall:
  frontend-url: http://localhost:5173
  cors:
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173
  security:
    admin-email: admin@example.com
    allowed-domains: ""
  encryption:
    secret-key: ${HEIMDALL_SECRET_KEY:ThisIsADefaultSecretKeyForDevEnv}
  snapshot:
    retention-days: 30
  backup:
    timeout-millis: 300000
    max-retry: 15
    dump-dir: ./heimdall-data/dumps
    process-timeout-minutes: 60
  storage:
    type: local
    s3:
      endpoint: http://localhost:8333
      region: us-east-1
      bucket-name: test-bucket
      access-key: dummy
      secret-key: dummy
      path-style-access: true
      auto-create-bucket: false

spring:
  application:
    name: backend
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_OAUTH_CLIENT_ID:sample-client-id-needs-to-be-changed}
            client-secret: ${GOOGLE_OAUTH_CLIENT_SECRET:sample-client-secret-needs-to-be-changed}
  datasource:
    url: jdbc:h2:file:./heimdall-data/config-db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

heimdall:
  frontend-url: ${HEIMDALL_FRONTEND_URL:http://localhost:5173}
  cors:
    allowed-origins: ${HEIMDALL_CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
  security:
    admin-email: ${HEIMDALL_ADMIN_EMAIL:admin@example.com}
    allowed-domains: ${HEIMDALL_ALLOWED_DOMAINS:}
  encryption:
    secret-key: ${HEIMDALL_SECRET_KEY:ThisIsADefaultSecretKeyForDevEnv}
  snapshot:
    retention-days: 30
  backup:
    timeout-millis: 300000
    max-retry: 15
    dump-dir: ./heimdall-data/dumps
    process-timeout-minutes: 60
  storage:
    type: ${HEIMDALL_STORAGE_TYPE:s3}
    s3:
      endpoint: ${HEIMDALL_S3_ENDPOINT:http://localhost:8333}
      region: ${HEIMDALL_S3_REGION:us-east-1}
      bucket-name: ${HEIMDALL_S3_BUCKET_NAME:heimdall-backups}
      access-key: ${HEIMDALL_S3_ACCESS_KEY:dummy-access-key}
      secret-key: ${HEIMDALL_S3_SECRET_KEY:dummy-secret-key}
      path-style-access: ${HEIMDALL_S3_PATH_STYLE_ACCESS:true}
      auto-create-bucket: ${HEIMDALL_S3_AUTO_CREATE_BUCKET:true}

spring:
  application:
    name: backend
  datasource:
    url: jdbc:h2:file:./heimdall-data/config-db
    driverClassName: org.h2.Driver
    username: sa
    password: password
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: validate
    show-sql: true
  flyway:
    enabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

heimdall:
  backup:
    timeout-millis: 300000
    max-retry: 15
    dump-dir: ./heimdall-data/dumps
